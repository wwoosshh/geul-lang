name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 수용 테스트 (참조 구현)
        run: python build.py test
      - name: 핫스왑 투명성 (참조 구현 — 긍정 테스트 전부를 --핫스왑 으로, D-46)
        run: python build.py test --핫스왑
      - name: 문서 예제 (D-33 — 문서가 낡으면 여기서 깨진다)
        run: python build.py docs
      - name: 프로그램 (프로그램/ 의 도구들이 실제로 만들어지는가)
        run: python build.py tools
      - name: 자체호스팅 교차 검증 (토큰·AST·IR 덤프, exe 바이트, 고정점, 명령줄)
        run: python build.py selfhost
      - name: 수용 테스트 (글로 쓴 컴파일러)
        run: python build.py test --self
      - name: 핫스왑 투명성 (글로 쓴 컴파일러)
        run: python build.py test --self --핫스왑
      - name: 배포물 — release 자기 컴파일 확인 + PyPI 휠 가상환경 설치 연기 시험 (D-47)
        run: python build.py wheel
